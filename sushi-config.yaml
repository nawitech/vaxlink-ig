id: nawitech.vaxlink
canonical: https://nawitech.github.io/vaxlink-ig
name: VaxLinkIG
title: "VaxLink: cross-border reference immunization record portability IG"
description: >-
  A reference IG for carrying routine immunization records across a border and verifying them on the
  WHO GDHCN, with Thailand and Lao PDR as the worked pair: the WHO PreQual layers a certificate
  carries, each receiving country's schedule-dose code system, and the deliberately partial map from
  vaccine type to national dose. First built for the WHO Pre-GDHF workshop; authored by Nawi and
  intended to move to a WHO repository.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: Apache-2.0
publisher:
  name: Nawitech Limited
  url: https://nawi.ke
jurisdiction:
  - urn:iso:std:iso:3166#LA "Lao People's Democratic Republic"
  - urn:iso:std:iso:3166#TH "Thailand"

dependencies:
  smart.who.int.pcmt-vaxprequal:
    uri: http://smart.who.int/pcmt-vaxprequal/ImplementationGuide/smart.who.int.pcmt-vaxprequal
    version: 0.2.0

pages:
  index.md:
    title: Home

menu:
  Home: index.html
  Artifacts: artifacts.html
